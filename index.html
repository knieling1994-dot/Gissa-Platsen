<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gissa Platsen</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; background: #222; color: white; }
        #menu, #win-screen, #turn-screen { position: fixed; top:0; left:0; width:100%; height:100%; background:#222; z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center; }
        #game-area { display: none; padding: 10px; }
        #map { height: 400px !important; width: 100% !important; display: block !important; margin: 10px 0; border: 2px solid white; cursor: crosshair; }
        #result-box { display:none; margin: 10px; padding: 10px; background: #444; font-size: 1.2em; border-radius: 8px; }
        button { padding: 15px 25px; font-size: 18px; cursor: pointer; border-radius: 5px; border: none; background: #fff; margin: 5px; }
    </style>
</head>
<body>

<div id="menu">
    <h1>Gissa Platsen</h1>
    <button onclick="startGame('lag')">Tävla i lag (Första klass vs Dressinen)</button><br><br>
    <button onclick="startGame('solo')">Öva själv</button>
</div>

<div id="turn-screen" style="display:none;">
    <h1 id="turn-text"></h1>
    <button onclick="startRound()">Starta tur!</button>
</div>

<div id="game-area">
    <div id="score-board" style="font-size:1.4em; font-weight:bold;">Första klass: 0 | Dressinen: 0</div>
    <img id="game-image" src="" style="max-width:90%; height:250px; border:3px solid white; margin-top:10px;">
    <div id="map"></div>
    <button id="action-btn">Gissa!</button>
    <button id="next-btn" style="display:none;">Nästa fråga</button>
    <div id="result-box"></div>
</div>

<div id="win-screen" style="display:none;">
    <h1 id="win-text"></h1>
    <button onclick="location.reload()">Spela igen</button>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="game.js"></script>
</body>
</html>
