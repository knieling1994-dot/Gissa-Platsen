<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Närmast Platsen Vinner</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Impact', sans-serif; margin: 0; background: #2c3e50; color: white;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        
        #menu, #win-screen, #turn-screen, #video-screen, #game-area { 
            position: fixed; top:0; left:0; width:100%; height:100%; background:#2c3e50; 
            z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center; padding: 10px;
        }
        #game-area { display: none; overflow: hidden; }

        .comic-title { color: #f1c40f; font-size: 8vh; text-transform: uppercase; text-shadow: 4px 4px 0 #000; transform: skewX(-5deg); margin-bottom: 20px; }
        .comic-btn { padding: 15px; font-size: 18px; border: 3px solid #000; background: #e67e22; color: white; margin: 5px; cursor: pointer; box-shadow: 4px 4px 0 rgba(0,0,0,0.5); text-transform: uppercase; width: 90%; max-width: 300px; }
        
        /* Layout för bild och statistik */
        .header-container { display: flex; align-items: center; justify-content: center; gap: 15px; width: 100%; margin-bottom: 10px; }
        #game-image { height: 100px; width: 150px; border: 3px solid white; object-fit: cover; }
        #score-stats { font-size: 1.1em; text-align: left; }
        #timer { font-size: 2em; color: #e74c3c; margin: 5px; }
        
        #map { flex-grow: 1; width: 100%; border: 3px solid #e67e22; border-radius: 5px; }
        #result-box { display: none; padding: 10px; background: #34495e; border-left: 5px solid #e67e22; margin-top: 10px; font-size: 14px; }
        
        #video-screen { background: black; }
        #video-screen video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

<div id="menu">
    <h1 class="comic-title">Närmast<br>Platsen<br>Vinner</h1>
    <button class="comic-btn" onclick="startGame('lag')">Första Klass mot Dressinen</button>
    <button class="comic-btn" onclick="startGame('solo')">Spela Solo</button>
</div>

<div id="video-screen" style="display:none;">
    <video id="intro-video" autoplay>
        <source src="intro.mp4" type="video/mp4">
    </video>
    <button class="comic-btn" style="position:absolute; bottom:20px;" onclick="finishVideo()">Hoppa över</button>
</div>

<div id="turn-screen" style="display:none;">
    <h1 class="comic-title">Redo?</h1>
    <button class="comic-btn" onclick="startRound()">Nu Reser Vi!</button>
</div>

<div id="game-area">
    <div class="header-container">
        <img id="game-image" src="" alt="Destination">
        <div id="score-stats">
            <div id="score-board"></div>
            <div id="timer"></div>
        </div>
    </div>
    <div id="map"></div>
    <div id="result-box"></div>
    <button id="action-btn" class="comic-btn">Lås Gissning 📍</button>
    <button id="next-btn" class="comic-btn" style="display:none;">Nästa Mål ➡️</button>
</div>

<div id="win-screen" style="display:none;">
    <h1 class="comic-title">Vinst!</h1>
    <button class="comic-btn" onclick="location.reload()">Nytt Äventyr</button>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="game.js"></script>
</body>
</html>
