<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Närmast Platsen Vinner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    :root {
      --ink: #1a1a2e;
      --paper: #f5f0e8;
      --cream: #ede8dc;
      --red: #c0392b;
      --gold: #d4a843;
      --track: #5d4e37;
      --muted: #7a6f62;
      --white: #ffffff;
      --shadow: 4px 4px 0px var(--ink);
      --shadow-lg: 6px 6px 0px var(--ink);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Screen system ── */
    .screen { display: none; }
    .screen.active { display: flex; }

    /* ── Buttons ── */
    .btn {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: .08em;
      color: var(--white);
      background: var(--red);
      border: 2.5px solid var(--ink);
      box-shadow: var(--shadow);
      padding: .6rem 1.4rem;
      cursor: pointer;
      transition: transform .1s, box-shadow .1s;
      
      /* MOBIL-FIXAR: */
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      z-index: 100;
    }

    /* Hover-effekten aktiveras BARA på skärmar med riktig muspekare (dator) */
    @media (hover: hover) {
      .btn:hover  { transform: translate(-2px,-2px); box-shadow: var(--shadow-lg); }
    }

    .btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
    .btn.secondary { background: var(--track); }
    
    .btn.ghost { background: transparent; color: var(--ink); box-shadow: none; border-color: transparent; }
    @media (hover: hover) {
      .btn.ghost:hover { background: rgba(0,0,0,0.05); box-shadow: none; transform: none; }
    }

    /* ── MENU ── */
    #menu {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 1.5rem;
      padding: 2rem;
    }
    #menu h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 10vw, 6rem);
      text-align: center;
      line-height: 1.1;
    }
    .menu-card {
      background: var(--cream);
      border: 2px solid var(--ink);
      box-shadow: var(--shadow);
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 400px;
    }

    /* ── VIDEO/TURN ── */
    #video-screen, #turn-screen {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 1.5rem;
      padding: 2rem;
    }
    #turn-text { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3rem, 8vw, 5rem); color: var(--red); }
    #video-screen video { max-width: 860px; width: 100%; border: 3px solid var(--ink); }

    /* ── GAME AREA ── */
    #game-area {
      flex-direction: column;
      min-height: 100vh;
      padding: 1rem;
      gap: 1rem;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      padding-bottom: 5rem; /* Extrayta i botten för att undvika mobila menyer */
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      background: var(--ink);
      color: var(--white);
      padding: .8rem 1.2rem;
      font-family: 'Bebas Neue', sans-serif;
      border: 2px solid var(--ink);
    }
    #timer.urgent { color: var(--red); }

    /* Vertikal layout för stapling! */
    .play-area {
      display: flex;
      flex-direction: column; /* Staplar elementen vertikalt */
      gap: 1rem;
      flex: 1; /* Fyller utrymmet mellan header och knappar */
      min-height: 0;
    }

    .panel {
      border: 2px solid var(--ink);
      box-shadow: var(--shadow);
      background: var(--cream);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .panel-label {
      position: absolute;
      top: 0; left: 0;
      background: var(--ink);
      color: var(--gold);
      padding: .3rem .8rem;
      font-family: 'Bebas Neue', sans-serif;
      font-size: .7rem;
      z-index: 10;
    }
    
    #game-image {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9; /* Sätter ett proportionellt mått för bilden */
      object-fit: cover; /* Ser till att bilden sträcker sig fint och fyller ytan */
      display: block;
    }
    
    #map {
      width: 100%;
      flex: 1; /* Kartan tar upp resten av utrymmet i play-area */
      min-height: 300px;
      z-index: 1; /* Ser till att Leaflets egna z-index inte stör knappar */
    }

    #result-box {
      background: var(--cream);
      border: 2px solid var(--ink);
      box-shadow: var(--shadow);
      padding: 1rem 1.4rem;
      display: none;
      gap: 1rem;
      align-items: center;
    }
    #result-box.visible { display: flex; }
    #result-score { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; color: var(--red); }
    #result-text { font-size: .9rem; color: var(--muted); line-height: 1.4; }

    .action-row { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: auto; position: relative; z-index: 100; }
    #next-btn { display: none; }

    /* ── WINNER OVERLAY ── */
    #winner-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(26,26,46,.9);
      z-index: 1000;
      align-items: center; justify-content: center;
      padding: 2rem;
    }
    #winner-overlay.show { display: flex; }
    .winner-card {
      background: var(--paper);
      border: 2px solid var(--ink);
      padding: 3rem;
      max-width: 450px;
      text-align: center;
      display: flex; flex-direction: column; gap: 1rem;
    }
    .winner-title { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; color: var(--red); line-height: 1; }
    .winner-score { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; border-top: 1px dashed; border-bottom: 1px dashed; padding: .6rem 0; }
  </style>
</head>
<body>

  <div id="menu" class="screen active">
    <h1>Närmast Platsen<br>Vinner</h1>
    <div class="menu-card">
      <button class="btn" id="btn-lag">⚔ Första Klass mot Dressinen</button>
      <button class="btn secondary" id="btn-solo">🗺 Spela Solo</button>
    </div>
  </div>

  <div id="video-screen" class="screen">
    <video id="intro-video" controls>
      <source src="intro.mp4" type="video/mp4" />
    </video>
    <button class="btn ghost" id="btn-skip-video">Hoppa över →</button>
  </div>

  <div id="turn-screen" class="screen">
    <h1 id="turn-text">Lag X</h1>
    <button class="btn" id="btn-start-round">Starta Tur</button>
  </div>

  <div id="game-area" class="screen">
    <div class="game-header">
      <span>Första Klass vs Dressinen</span>
      <div id="score-board">FK: 0 | D: 0</div>
      <div id="timer">15</div>
    </div>

    <div class="play-area">
      <div class="panel">
        <span class="panel-label">📍 Var är detta?</span>
        <img id="game-image" src="" alt="Resmål" />
      </div>
      <div class="panel">
        <span class="panel-label">🗺 Karta</span>
        <div id="map"></div>
      </div>
    </div>

    <div id="result-box">
      <div id="result-score">📍</div>
      <div id="result-text">Resultat.</div>
    </div>

    <div class="action-row">
      <button class="btn" id="action-btn">🔒 Gissa</button>
      <button class="btn secondary" id="next-btn">Nästa →</button>
      <button class="btn ghost" id="menu-btn">Huvudmeny</button>
    </div>
  </div>

  <div id="winner-overlay">
    <div class="winner-card">
      <div class="winner-title" id="winner-title">Lag vinner!</div>
      <div class="winner-score" id="winner-score">0 - 0</div>
      <button class="btn ghost" id="btn-winner-menu">Tillbaka till menyn</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="game.js"></script>
</body>
</html>
